<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Data Collection Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1>Student Registration</h1>
            <p>Please fill out the form below to submit your details.</p>
        </div>

        <form id="studentForm">
            <!-- Name -->
            <div class="form-group">
                <label for="name">1. Name of the student *</label>
                <input type="text" id="name" name="name" required placeholder="Enter full name">
            </div>

            <!-- Address -->
            <div class="form-group">
                <label for="address">2. Address *</label>
                <textarea id="address" name="address" required placeholder="Enter your full address" rows="3"></textarea>
            </div>

            <!-- Mobile -->
            <div class="form-group">
                <label for="mobile">3. Mobile Number *</label>
                <input type="tel" id="mobile" name="mobile" required placeholder="10-digit mobile number" pattern="[0-9]{10}">
            </div>

            <!-- WhatsApp -->
            <div class="form-group">
                <label for="whatsapp">4. WhatsApp Number (Optional)</label>
                <input type="tel" id="whatsapp" name="whatsapp" placeholder="10-digit WhatsApp number" pattern="[0-9]{10}">
            </div>

            <!-- Panchayat -->
            <div class="form-group">
                <label for="panchayat">5. Panchayat *</label>
                <div class="select-wrapper">
                    <select id="panchayat" name="panchayat" required>
                        <option value="" disabled selected>Select Panchayat</option>
                        <option value="Aruvappulam">Aruvappulam</option>
                        <option value="Chittar">Chittar</option>
                        <option value="Kalanjoor">Kalanjoor</option>
                        <option value="Konni">Konni</option>
                        <option value="Malayalapuzha">Malayalapuzha</option>
                        <option value="Mylapra">Mylapra</option>
                        <option value="Pramadom">Pramadom</option>
                        <option value="Seethathodu">Seethathodu</option>
                        <option value="Thannithode">Thannithode</option>
                        <option value="Vallicode">Vallicode</option>
                        <option value="Enadimangalam">Enadimangalam</option>
                        <option value="None of the Above">None of the Above</option>
                    </select>
                </div>
            </div>

            <!-- Standard -->
            <div class="form-group">
                <label for="standard">6. Standard *</label>
                <div class="select-wrapper">
                    <select id="standard" name="standard" required>
                        <option value="" disabled selected>Select Standard</option>
                        <option value="10th">10th</option>
                        <option value="Plus Two">Plus Two</option>
                    </select>
                </div>
            </div>

            <!-- School -->
            <div class="form-group">
                <label for="school">7. Name of the School *</label>
                <div class="select-wrapper">
                    <select id="school" name="school" required>
                        <option value="" disabled selected>Select School</option>
                        <!-- Options injected via JS for cleanliness -->
                    </select>
                </div>
            </div>

            <!-- Other School -->
            <div class="form-group" id="otherSchoolGroup">
                <label for="otherSchool">8. Mention your school name if not in the above list</label>
                <input type="text" id="otherSchool" name="otherSchool" placeholder="Your school name">
            </div>

            <!-- Photo -->
            <div class="form-group">
                <label for="photo">9. Upload a Passport size photo *</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="photo" name="photo" accept="image/*" required>
                    <div class="file-upload-ui" id="photo-ui">
                        <span class="icon">📷</span>
                        <span class="text">Tap to upload photo</span>
                    </div>
                </div>
            </div>

            <!-- Mark Sheet -->
            <div class="form-group">
                <label for="marksheet">10. Upload Mark Sheet *</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="marksheet" name="marksheet" accept=".pdf,image/*" required>
                    <div class="file-upload-ui" id="marksheet-ui">
                        <span class="icon">📄</span>
                        <span class="text">Tap to upload mark sheet</span>
                    </div>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" id="submitBtn" class="submit-btn">
                <span>Submit Details</span>
                <div class="spinner"></div>
            </button>
            <div id="statusMessage" class="status-message"></div>
        </form>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="success-icon">✓</div>
            <h2>Success!</h2>
            <p>Your details have been submitted successfully.</p>
            
            <div class="whatsapp-prompt" style="margin: 25px 0; padding: 20px; background-color: #F0FDF4; border-radius: 12px; border: 1px solid #BBF7D0;">
                <p style="margin-bottom: 12px; font-weight: 600; color: #166534; font-size: 1.05rem;">Get Further Updates</p>
                <a href="https://chat.whatsapp.com/HPLIVnUDc8B4zqJfPk6lKZ?s=cl&p=a&ilr=1" target="_blank" class="whatsapp-btn">
                    💬 Join Official WhatsApp Group
                </a>
            </div>

            <button onclick="window.location.reload()" class="submit-btn secondary-btn">Submit Another</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
